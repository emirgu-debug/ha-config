- id: '1789070241083'
  alias: Apple TV Playback - PANJUR_TV Shutter
  description: 'Gündüz Apple TV''de video başlayınca PANJUR_TV''yi kapatır (Apple
    Music ve AirPlay hariç). Oynatma 30 dk durursa/boşta kalırsa/kapanırsa veya gün
    batımında, sadece kendisi kapattıysa (input_boolean.panjur_tv_apple_tv_kapatti)
    açar. not_from unavailable/unknown: HA restart veya Apple TV bağlantı kopması
    panjuru hareket ettirmez. Güncelleme: 28 Eyl 2026.'
  triggers:
  - trigger: state
    entity_id: media_player.living_room_living_room
    to: playing
    not_from:
    - unavailable
    - unknown
    id: play
  - trigger: state
    entity_id: media_player.living_room_living_room
    attribute: app_id
    from:
    - com.apple.TVMusic
    - com.apple.TVAirPlay
    id: play
  - trigger: state
    entity_id: media_player.living_room_living_room
    to:
    - paused
    - idle
    - 'off'
    not_from:
    - unavailable
    - unknown
    for:
      minutes: 30
    id: stop
  - trigger: sun
    event: sunset
    id: sunset
  conditions: []
  actions:
  - choose:
    - alias: Kapat
      conditions:
      - condition: trigger
        id: play
      - condition: state
        entity_id: media_player.living_room_living_room
        state: playing
      - condition: state
        entity_id: sun.sun
        state: above_horizon
      - condition: not
        conditions:
        - condition: state
          entity_id: media_player.living_room_living_room
          attribute: app_id
          state:
          - com.apple.TVMusic
          - com.apple.TVAirPlay
      - condition: state
        entity_id: cover.panjur_tv
        state: open
      sequence:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.panjur_tv_apple_tv_kapatti
      - action: cover.close_cover
        target:
          entity_id: cover.panjur_tv
    - alias: Aç
      conditions:
      - condition: trigger
        id:
        - stop
        - sunset
      - condition: state
        entity_id: input_boolean.panjur_tv_apple_tv_kapatti
        state: 'on'
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.panjur_tv_apple_tv_kapatti
      - action: cover.open_cover
        target:
          entity_id: cover.panjur_tv
  mode: restart
- id: '1789105284347'
  alias: Leyla Oda Dyson Sicaklik - LEYLA_Klima Kontrol
  description: Turns LEYLA_Klima on at 26°C when the Dyson X6P-EU-THB1395A (Leyla
    Oda) temperature reaches 28°C, and turns it off when it drops back to 26°C.
  triggers:
  - platform: numeric_state
    entity_id: sensor.dyson_x6p_eu_thb1395a_temperature
    above: 27.9
    id: hot
  - platform: numeric_state
    entity_id: sensor.dyson_x6p_eu_thb1395a_temperature
    below: 26.1
    id: cool
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: hot
      sequence:
      - data:
          unit: leyla
          temp: 26
        action: script.ac_set_temperature
    - conditions:
      - condition: trigger
        id: cool
      sequence:
      - data:
          unit: leyla
        action: script.ac_turn_off
  mode: single
- id: '1789107321958'
  alias: Oda Klima - Gece Sicaklik Dongusu (22:00-08:00)
  description: Between 22:00 and 08:00, turns ODA_KLİMA on at 24°C when the Bedroom
    sensor (Oda_Sıcaklık_Nem_Ekransız) hits 27°C, and off when it drops to 25°C. Forces
    it off at 08:00 regardless.
  triggers:
  - entity_id:
    - sensor.oda_sicaklik_nem_ekransiz_temperature
    above: 26
    id: hot
    trigger: numeric_state
  - entity_id:
    - sensor.oda_sicaklik_nem_ekransiz_temperature
    below: 24.9
    id: cool
    trigger: numeric_state
  - at: 08:00:00
    id: morning_off
    trigger: time
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: hot
      - condition: time
        after: '22:00:00'
        before: 08:00:00
      sequence:
      - data:
          unit: oda
          temp: 24
        action: script.ac_set_temperature
    - conditions:
      - condition: trigger
        id: cool
      - condition: time
        after: '22:00:00'
        before: 08:00:00
      sequence:
      - data:
          unit: oda
        action: script.ac_turn_off
    - conditions:
      - condition: trigger
        id: morning_off
      sequence:
      - data:
          unit: oda
        action: script.ac_turn_off
  mode: single
- id: am07_hiz_senkron
  alias: AM07 hiz senkron
  description: Debounced reconciler for the AM07 fan speed. 30 s after the last speed
    change it compares the commanded speed (input_number.am07_hiz) with the measured
    one (sensor.am07_olculen_hiz, derived from ikinci_priz wattage). If the IR blaster
    missed presses it resends up to 3 pulses, then snaps the helper to whatever the
    fan is actually doing, so the panel can never drift.
  triggers:
  - trigger: state
    entity_id: sensor.am07_olculen_hiz
  - trigger: state
    entity_id: input_number.am07_hiz
  conditions:
  - condition: state
    entity_id: binary_sensor.ikinci_priz_am07_calisiyor
    state: 'on'
  actions:
  - delay:
      seconds: 30
  - variables:
      target: '{{ states(''input_number.am07_hiz'') | int(0) }}'
      actual: '{{ states(''sensor.am07_olculen_hiz'') | int(0) }}'
  - condition: template
    value_template: '{{ actual | int(0) > 0 and target | int(0) != actual | int(0)
      }}'
  - repeat:
      count: '{{ [ (target | int(0) - actual | int(0)) | abs, 3 ] | min }}'
      sequence:
      - action: text.set_value
        target:
          entity_id: text.salon_klima_ir_code_to_send
        data:
          value: '{{ ''HwoJfgPGApMGxgJ+A8YCZAPGAnkGxgJkA8YCZAPGAmQDH8YCmAPGApMGxgJ+A8YCkwbGAmQDxgJ5BsYCZAPGAnkGA8YCzrE=''
            if target | int(0) > actual | int(0) else ''H4cIfgPGApMGxgJ+A8YCZAPGAnkGxgJkA8YCZAPGAmQDH8YCrQbGApMGxgKTBsYCkwbGAnkGxgJ5BsYCZAPGAmQDA8YCzrE=''
            }}'
      - delay:
          milliseconds: 900
  - delay:
      seconds: 20
  - action: input_number.set_value
    target:
      entity_id: input_number.am07_hiz
    data:
      value: '{{ [ states(''sensor.am07_olculen_hiz'') | int(1), 1 ] | max }}'
  mode: restart
- id: appletv_tv_dixon_isik
  alias: Apple TV · TV Dixon ışığı
  description: Hava karardıktan sonra Apple TV oynatmaya başlayınca TV Dixon spotunu
    açar. Apple TV uykuya alındığında (media_player → off/standby) ve hava hâlâ karanlıksa
    spotu kapatır — yatma vakti sayılır. Parlaklık ve renk sıcaklığını adaptif ışık
    otomasyonu belirler; bu yüzden ışık yalnızca KAPALIYKEN açılır, böylece elle ayarlanmış
    bir renk ezilmez.
  triggers:
  - trigger: state
    entity_id: media_player.living_room_living_room
    to: playing
    id: play
  - trigger: state
    entity_id: media_player.living_room_living_room
    to:
    - 'off'
    - standby
    not_from:
    - unavailable
    - unknown
    for:
      seconds: 30
    id: sleep
  - trigger: state
    entity_id: sun.sun
    to: below_horizon
    id: sunset
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: trigger
          id:
          - play
        - condition: and
          conditions:
          - condition: trigger
            id:
            - sunset
          - condition: state
            entity_id: media_player.living_room_living_room
            state: playing
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: light.tv_dixon_hue
        state: 'off'
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.tv_dixon_hue
    - conditions:
      - condition: trigger
        id:
        - sleep
      - condition: state
        entity_id: sun.sun
        state: below_horizon
      - condition: state
        entity_id: light.tv_dixon_hue
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.tv_dixon_hue
        data:
          transition: 4
  mode: restart
