- id: '1789931897022'
  alias: Entrance Face Recognition - Emir Salon Lights
  description: 'Turns on Salon L1 & L2 for 2 minutes and greets Emir through the entrance
    camera speaker when Frigate recognizes his face at the entrance (tapo_kapi) camera
    via MQTT frigate/events, then turns the lights off. NOTE: Frigate publishes after.sub_label
    as a [name, score] LIST over MQTT (not a plain string like its REST API) - must
    index [0]. Speaker requires media_player.entrance_camera_speaker (webrtc/go2rtc
    tapo_kapi two-way audio) to exist - pending HA restart + go2rtc tapo:// source.'
  triggers:
  - trigger: mqtt
    options:
      topic: frigate/events
      value_template: '{{ value_json.after.camera ~ ''|'' ~ value_json.after.label
        ~ ''|'' ~ (value_json.after.sub_label[0] if value_json.after.sub_label else
        '''') }}'
      payload: entrance|person|Emir
  conditions: []
  actions:
  - action: tts.speak
    target:
      entity_id: tts.google_translate_en_com
    data:
      media_player_entity_id: media_player.entrance_camera_speaker
      message: Welcome Home
  mode: restart
- id: git_config_sync
  alias: Git · /config saatlik yedek (GitHub)
  description: Her saat :07de /config degisikliklerini emirgu-debug/ha-config reposuna
    commit + push eder (shell_command.git_sync, whitelist .gitignore). Hata olursa
    persistent notification (git_sync_error) duser. GitHub token 27 Eyl yenilendi.
    Bkz. claude/git-config-repo.md
  triggers:
  - trigger: time_pattern
    minutes: 7
  conditions: []
  actions:
  - action: shell_command.git_sync
    data:
      message: Hourly auto-sync
    response_variable: sync
  - if:
    - condition: template
      value_template: '{{ sync.returncode != 0 }}'
    then:
    - action: persistent_notification.create
      data:
        title: Git yedek hatası
        message: 'git_sync returncode {{ sync.returncode }}: {{ sync.stdout }} {{
          sync.stderr }}'
        notification_id: git_sync_error
  mode: single
