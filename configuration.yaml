# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
go2rtc:
  url: http://localhost:1984
rest: !include rest_go2rtc.yaml

media_player:
  - platform: webrtc
    name: Entrance Camera Speaker
    stream: tapo_kapi
    audio: pcma

# /config -> GitHub mirror (see project doc claude/git-config-repo.md)
shell_command:
  git_sync: "sh /config/tools/git_sync.sh '{{ message | default('Auto sync') }}'"
