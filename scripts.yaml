ac_apply_state:
  alias: AC Apply State
  description: 'Set temperature and fan together with a single IR send (used by panel
    presets). unit: salon/leyla/oda, temp: 18-30 even, fan: auto/1-5.'
  mode: queued
  max: 5
  fields:
    unit:
      name: Unit
      required: true
      selector:
        select:
          options:
          - salon
          - leyla
          - oda
    temp:
      name: Temperature
      required: true
      selector:
        number:
          min: 18
          max: 30
          step: 2
          unit_of_measurement: °C
    fan:
      name: Fan
      required: true
      selector:
        select:
          options:
          - auto
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
