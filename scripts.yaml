      temp_helper: '{{ ''input_number.salon_klima_sicaklik'' if unit == ''salon''
        else (''input_number.leyla_klima_sicaklik'' if unit == ''leyla'' else ''input_number.oda_klima_sicaklik'')
        }}'
      fan_helper: '{{ ''input_select.salon_klima_fan_hizi'' if unit == ''salon'' else
        (''input_select.leyla_klima_fan_hizi'' if unit == ''leyla'' else ''input_select.oda_klima_fan_hizi'')
        }}'
      target_entity: '{{ ''text.salon_klima_ir_code_to_send'' if unit == ''salon''
        else (''text.leyla_klima_ir_code_to_send'' if unit == ''leyla'' else ''text.oda_klima_ir_code_to_send'')
        }}'
      mode_helper: '{{ ''input_select.salon_klima_mod'' if unit == ''salon'' else
        (''input_select.leyla_klima_mod'' if unit == ''leyla'' else ''input_select.oda_klima_mod'')
        }}'
      stamp_helper: '{{ ''input_datetime.salon_klima_son_komut'' if unit == ''salon''
        else (''input_datetime.leyla_klima_son_komut'' if unit == ''leyla'' else ''input_datetime.oda_klima_son_komut'')
        }}'
      key: '{{ (temp|int|string) ~ ''_'' ~ (fan|string) }}'
  - if:
    - condition: template
      value_template: '{{ key not in code_map }}'
    then:
    - stop: No IR code for this temp/fan combination
      error: true
  - action: input_number.set_value
    target:
      entity_id: '{{ temp_helper }}'
    data:
      value: '{{ temp|int }}'
  - action: input_select.select_option
    target:
      entity_id: '{{ fan_helper }}'
    data:
      option: '{{ fan|string }}'
  - action: text.set_value
    target:
      entity_id: '{{ target_entity }}'
    data:
      value: '{{ code_map[key] }}'
  - action: input_select.select_option
    target:
      entity_id: '{{ mode_helper }}'
    data:
      option: cool
  - action: input_datetime.set_datetime
    target:
      entity_id: '{{ stamp_helper }}'
    data:
      timestamp: '{{ now().timestamp() }}'
ac_all_off:
  alias: AC All Off
  description: Turn off all three Daikin units (Salon, Leyla, Oda).
  mode: single
  icon: mdi:power
  sequence:
  - action: script.ac_turn_off
    data:
      unit: salon
    continue_on_error: true
  - action: script.ac_turn_off
    data:
      unit: leyla
    continue_on_error: true
  - action: script.ac_turn_off
    data:
      unit: oda
    continue_on_error: true
am07_power_toggle:
  alias: AM07 Power Toggle
  description: Sends the next Dyson AM07 power code. The remote rotates through three
    codes, so this keeps the rotation in step.
  mode: single
  icon: mdi:power
  sequence:
  - variables:
      codes:
        '0': H6EIfgPGApMGxgJkA8YCZAPGAnkGxgJkA8YCZAPGAkkDH8YCmAPGAn4DxgJkA8YCZAPGAmQDxgJkA8YCZAPGAmQDA8YCzrE=
        '1': H6EIfgPGApMGxgJkA8YCZAPGAnkGxgJkA8YCZAPGAkkDH8YCmAPGAn4DxgJkA8YCZAPGAmQDxgJkA8YCZAPGAnkGA8YCzrE=
        '2': H6EIfgPGApMGxgJkA8YCZAPGAnkGxgJkA8YCZAPGAkkDH8YCmAPGAn4DxgJkA8YCZAPGAmQDxgJkA8YCeQbGAmQDA8YCzrE=
      idx: '{{ states(''input_number.am07_kod_index'') | int(0) }}'
  - action: text.set_value
    target:
      entity_id: text.salon_klima_ir_code_to_send
    data:
      value: '{{ codes[idx | string] }}'
  - action: input_number.set_value
    target:
      entity_id: input_number.am07_kod_index
    data:
      value: '{{ (idx + 1) % 3 }}'
am07_turn_on:
  alias: AM07 Turn On
  description: Turns the AM07 on and confirms it with the binary_sensor.ikinci_priz_am07_calisiyor
    power measurement; retries once if the IR was missed.
  mode: single
  icon: mdi:fan
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.ikinci_priz_am07_calisiyor
      state: 'off'
    then:
    - action: script.am07_power_toggle
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.ikinci_priz_am07_calisiyor
        to: 'on'
      timeout:
        seconds: 25
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - action: script.am07_power_toggle
        data: {}
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.ikinci_priz_am07_calisiyor
          to: 'on'
        timeout:
          seconds: 25
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - action: persistent_notification.create
          data:
            title: AM07 did not respond
            message: Sent the power code twice but binary_sensor.ikinci_priz_am07_calisiyor
              never turned on. Check line of sight to the SALON_KLIMA blaster, or
              that the fan is plugged into ikinci_priz.
            notification_id: am07_no_response
am07_turn_off:
  alias: AM07 Turn Off
  description: Turns the AM07 off and confirms it with the binary_sensor.ikinci_priz_am07_calisiyor
    power measurement; retries once if the IR was missed.
  mode: single
  icon: mdi:fan-off
  sequence:
  - if:
    - condition: state
      entity_id: binary_sensor.ikinci_priz_am07_calisiyor
      state: 'on'
    then:
    - action: script.am07_power_toggle
    - wait_for_trigger:
      - trigger: state
        entity_id: binary_sensor.ikinci_priz_am07_calisiyor
        to: 'off'
      timeout:
        seconds: 25
      continue_on_timeout: true
    - if:
      - condition: template
        value_template: '{{ not wait.completed }}'
      then:
      - action: script.am07_power_toggle
        data: {}
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.ikinci_priz_am07_calisiyor
          to: 'off'
        timeout:
          seconds: 25
        continue_on_timeout: true
      - if:
        - condition: template
          value_template: '{{ not wait.completed }}'
        then:
        - action: persistent_notification.create
          data:
            title: AM07 did not respond
            message: Sent the power code twice but binary_sensor.ikinci_priz_am07_calisiyor
              never turned off. Check line of sight to the SALON_KLIMA blaster, or
              that the fan is plugged into ikinci_priz.
            notification_id: am07_no_response
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.am07_swing_acik
am07_speed_up:
  alias: AM07 Speed Up
  description: One speed step up. Starts from the MEASURED speed (sensor.am07_olculen_hiz,
    derived from plug wattage) unless a press was made in the last 20 s, in which
    case it continues optimistically from input_number.am07_hiz. automation.am07_hiz_senkron
    reconciles afterwards.
  mode: queued
  max: 10
  icon: mdi:plus
  sequence:
  - condition: state
    entity_id: binary_sensor.ikinci_priz_am07_calisiyor
    state: 'on'
  - variables:
      cur: '{% set age = (now() - states.input_number.am07_hiz.last_changed).total_seconds()
        %}{% set m = states(''sensor.am07_olculen_hiz'') | int(0) %}{% set c = states(''input_number.am07_hiz'')
        | int(1) %}{{ c if (age < 20 or m < 1) else m }}'
  - condition: template
    value_template: '{{ cur | int(1) < 10 }}'
  - action: text.set_value
    target:
      entity_id: text.salon_klima_ir_code_to_send
    data:
      value: HwoJfgPGApMGxgJ+A8YCZAPGAnkGxgJkA8YCZAPGAmQDH8YCmAPGApMGxgJ+A8YCkwbGAmQDxgJ5BsYCZAPGAnkGA8YCzrE=
  - action: input_number.set_value
    target:
      entity_id: input_number.am07_hiz
    data:
      value: '{{ cur | int(1) + 1 }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.am07_son_komut
    data:
      timestamp: '{{ now().timestamp() }}'
  - delay:
      milliseconds: 700
am07_speed_down:
  alias: AM07 Speed Down
  description: One speed step down. Starts from the MEASURED speed (sensor.am07_olculen_hiz,
    derived from plug wattage) unless a press was made in the last 20 s, in which
    case it continues optimistically from input_number.am07_hiz. automation.am07_hiz_senkron
    reconciles afterwards.
  mode: queued
  max: 10
  icon: mdi:minus
  sequence:
  - condition: state
    entity_id: binary_sensor.ikinci_priz_am07_calisiyor
    state: 'on'
  - variables:
      cur: '{% set age = (now() - states.input_number.am07_hiz.last_changed).total_seconds()
        %}{% set m = states(''sensor.am07_olculen_hiz'') | int(0) %}{% set c = states(''input_number.am07_hiz'')
        | int(1) %}{{ c if (age < 20 or m < 1) else m }}'
  - condition: template
    value_template: '{{ cur | int(1) > 1 }}'
  - action: text.set_value
    target:
      entity_id: text.salon_klima_ir_code_to_send
    data:
      value: H4cIfgPGApMGxgJ+A8YCZAPGAnkGxgJkA8YCZAPGAmQDH8YCrQbGApMGxgKTBsYCkwbGAnkGxgJ5BsYCZAPGAmQDA8YCzrE=
  - action: input_number.set_value
    target:
      entity_id: input_number.am07_hiz
    data:
      value: '{{ cur | int(1) - 1 }}'
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.am07_son_komut
    data:
      timestamp: '{{ now().timestamp() }}'
  - delay:
      milliseconds: 700
am07_swing:
  alias: AM07 Swing
  description: Toggles AM07 oscillation. No feedback exists, so input_boolean.am07_swing_acik
    is an assumption that flips on every press.
  mode: single
  icon: mdi:arrow-oscillating
  sequence:
  - condition: state
    entity_id: binary_sensor.ikinci_priz_am07_calisiyor
    state: 'on'
  - action: text.set_value
    target:
      entity_id: text.salon_klima_ir_code_to_send
    data:
      value: H6EIfgPgAnkGxgJkA+ACZAPgAnkG4AJkA+ACZAPgAmQDH8YCkwbgAn4DxgJ5BsYCZAPGAnkGxgJkA8YCXgbGAmQDA+ACzrE=
  - action: input_boolean.toggle
    target:
      entity_id: input_boolean.am07_swing_acik
  - action: input_datetime.set_datetime
    target:
      entity_id: input_datetime.am07_son_komut
    data:
      timestamp: '{{ now().timestamp() }}'
isiklari_kapat:
  alias: Işıkları kapat
  description: 'Evdeki tüm aydınlatmayı kapatır: 5 Hue ampul, 8 anahtar kanalı ve
